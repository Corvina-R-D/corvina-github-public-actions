name: Publish npm package

# Called on `release: published`: publishes each package at the release tag version via npm
# trusted publishing, then bumps `version-files` on the default branch. The npm trusted
# publisher must name the caller's workflow file.
# Release tag: `X.Y.Z` or `vX.Y.Z`, optionally `-<pre>.N` for prereleases, which get a
# dist-tag (`2.0.0-beta.1` -> beta, `2.0.0-0` -> next), never `latest`; preceded by
# `tag-prefix`, if set.
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding the root package.json; the paths below are relative to it
        type: string
        default: "."
      node-version:
        description: Node.js version used to install, test and build
        type: string
        default: "22"
      package-manager:
        description: "`npm` (`npm ci`, if package-lock.json exists) or `yarn` (Berry, via Corepack)"
        type: string
        default: npm
      go-version-file:
        description: go.mod path from the repo root, to set up Go for the build; empty for none
        type: string
        default: ""
      test-script:
        description: Script run before building; empty to skip
        type: string
        default: test
      build-script:
        description: Script that builds the packages
        type: string
        default: build
      # Lists: block scalar, one `- item` per line (inputs can't be YAML sequences).
      publish-dirs:
        description: Directories, after the build, each holding a package to publish, in order
        type: string
        default: "- ."
      version-files:
        description: Manifests set to the released version; the first one is the reference
        type: string
        default: "- package.json"
      default-branch:
        description: Branch where the released version is recorded
        type: string
        default: main
      tag-prefix:
        description: Prefix of the release tag before the version, e.g. `my-lib-` for `my-lib-v1.2.3`, to release packages of one repo separately
        type: string
        default: ""

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  TAG_PREFIX: ${{ inputs.tag-prefix }}
  PM: ${{ inputs.package-manager }}
  LIST_SED: 's/^\s*(-\s+)?(\S.*\S|\S)\s*$/\2/p'
  # Sets `version` in the given manifests, keeping their formatting, plus any sibling
  # package-lock.json and the dependency ranges between the listed packages.
  SET_VERSION_JS: |
    const fs = require("fs");
    const path = require("path");
    const [version, ...manifests] = process.argv.slice(1);
    const files = manifests.flatMap((f) => {
      const lock = path.join(path.dirname(f), "package-lock.json");
      return path.basename(f) === "package.json" && fs.existsSync(lock) ? [f, lock] : [f];
    });
    const names = manifests.map((f) => JSON.parse(fs.readFileSync(f, "utf8")).name).filter(Boolean);
    const escape = (s) => s.replace(/[.*+?^${}()|[\]\\/]/g, "\\$&");
    for (const file of files) {
      let text = fs.readFileSync(file, "utf8");
      if (path.basename(file) === "package-lock.json") {
        const lock = JSON.parse(text);
        lock.version = version;
        if (lock.packages?.[""]) lock.packages[""].version = version;
        text = JSON.stringify(lock, null, 2) + "\n";
      } else {
        text = text.replace(/("version"\s*:\s*")[^"]*"/, `$1${version}"`);
        for (const name of names) {
          text = text.replace(new RegExp(`("${escape(name)}"\\s*:\\s*"[~^]?)\\d[^"]*"`, "g"), `$1${version}"`);
        }
      }
      if (JSON.parse(text).version !== version) throw new Error(`no top-level version in ${file}`);
      fs.writeFileSync(file, text);
    }

jobs:
  publish:
    name: Build and publish on npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Release tag: `X.Y.Z` or `vX.Y.Z`, optionally `-<pre>.N` for prereleases, which get a
      # dist-tag (`2.0.0-beta.1` -> beta, `2.0.0-0` -> next), never `latest`.
      - name: Resolve version from release tag
        id: version
        working-directory: .
        run: |
          VERSION="${RELEASE_TAG#"${TAG_PREFIX}"}"
          VERSION="${VERSION#v}"
          if [[ "$RELEASE_TAG" != "${TAG_PREFIX}"* ]] || ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not a semver version (expected e.g. ${TAG_PREFIX}1.2.9)"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            DIST_TAG="${PRERELEASE%%.*}"
            [[ "$DIST_TAG" =~ ^[0-9]+$ ]] && DIST_TAG=next
            if ! [[ "$DIST_TAG" =~ ^[A-Za-z][0-9A-Za-z-]*$ ]] || [[ "$DIST_TAG" =~ ^([xX]|[vV][0-9].*|latest)$ ]]; then
              echo "::error::Release tag '$RELEASE_TAG' would publish under dist-tag '$DIST_TAG', which npm refuses or which would move 'latest' (expected e.g. 2.0.0-beta.1)"
              exit 1
            fi
            echo "DIST_TAG=${DIST_TAG}" >> "${GITHUB_ENV}"
          fi

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Go
        if: inputs.go-version-file != ''
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        if: inputs.package-manager == 'npm'
        run: npm install -g npm@^11.5.1

      - name: Enable Corepack
        if: inputs.package-manager == 'yarn'
        run: corepack enable

      - name: Install dependencies
        run: |
          if [ "${PM}" = yarn ]; then
            yarn install --immutable
          elif [ -f package-lock.json ]; then
            npm ci
          fi

      # Before the build, so build steps reading the version see the released one.
      - name: Set version from release tag
        env:
          VERSION_FILES: ${{ inputs.version-files }}
        run: |
          mapfile -t files < <(sed -nE "${LIST_SED}" <<< "${VERSION_FILES}")
          node -e "${SET_VERSION_JS}" "${VERSION}" "${files[@]}"

      - name: Test
        if: inputs.test-script != ''
        env:
          SCRIPT: ${{ inputs.test-script }}
        run: ${PM} run "${SCRIPT}"

      - name: Build
        env:
          SCRIPT: ${{ inputs.build-script }}
        run: ${PM} run "${SCRIPT}"

      # OIDC auth, no token. Already published versions are skipped so re-runs succeed.
      # Yarn, unlike npm, adds provenance only when asked.
      - name: Publish on npm
        env:
          PUBLISH_DIRS: ${{ inputs.publish-dirs }}
          PROVENANCE: ${{ !github.event.repository.private && '--provenance' || '' }}
        run: |
          mapfile -t dirs < <(sed -nE "${LIST_SED}" <<< "${PUBLISH_DIRS}")
          for dir in "${dirs[@]}"; do
            (
              cd "${dir}"
              PACKAGE="$(node -p "require('./package.json').name")"
              if [ "$(node -p "require('./package.json').version")" != "${VERSION}" ]; then
                echo "::error::${dir}/package.json is not at ${VERSION}: add its source to version-files"
                exit 1
              fi
              if [ -n "$(npm view "${PACKAGE}@${VERSION}" version 2>/dev/null)" ]; then
                echo "::notice::${PACKAGE}@${VERSION} is already published, skipping"
                exit 0
              fi
              if [ "${PM}" = yarn ]; then
                yarn npm publish --access public ${DIST_TAG:+--tag "${DIST_TAG}"} ${PROVENANCE}
              else
                npm publish --access public ${DIST_TAG:+--tag "${DIST_TAG}"}
              fi
              echo "Published [${PACKAGE}@${VERSION}](https://www.npmjs.com/package/${PACKAGE}/v/${VERSION})" >> "${GITHUB_STEP_SUMMARY}"
            )
          done

  # Separate job: a failure here doesn't affect the published package and can be re-run alone.
  sync-version:
    name: Record the released version
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      DEFAULT_BRANCH: ${{ inputs.default-branch }}
      VERSION_FILES: ${{ inputs.version-files }}
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      # Only moves forward: skips prereleases and versions not newer than the first file's.
      - name: Decide whether the version needs the bump
        id: bump
        run: |
          mapfile -t files < <(sed -nE "${LIST_SED}" <<< "${VERSION_FILES}")
          CURRENT="$(node -p 'require(require("path").resolve(process.argv[1])).version' "${files[0]}")"
          PACKAGE="$(node -p 'process.argv.slice(1).map((f) => require(require("path").resolve(f)).name).filter(Boolean).join(", ")' "${files[@]}")"
          echo "PACKAGE=${PACKAGE}" >> "${GITHUB_ENV}"
          if [[ "$VERSION" == *-* ]]; then
            echo "::notice::${VERSION} is a prerelease, leaving ${DEFAULT_BRANCH} at ${CURRENT}"
          elif node -e '
            const core = (v) => v.split("-")[0].split(".").map(Number);
            const [release, current] = process.argv.slice(1);
            const [r, c] = [core(release), core(current)];
            for (let i = 0; i < 3; i++) if (r[i] !== c[i]) process.exit(r[i] > c[i] ? 0 : 1);
            process.exit(current.includes("-") ? 0 : 1);
          ' "$VERSION" "$CURRENT"; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::${DEFAULT_BRANCH} is already at ${CURRENT}, not moving it to ${VERSION}"
          fi

      # yarn.lock records the dependency ranges between the packages, which may have changed.
      - name: Set version
        if: steps.bump.outputs.needed == 'true'
        run: |
          mapfile -t files < <(sed -nE "${LIST_SED}" <<< "${VERSION_FILES}")
          node -e "${SET_VERSION_JS}" "${VERSION}" "${files[@]}"
          if [ "${PM}" = yarn ]; then
            corepack enable
            yarn install --mode=update-lockfile
          fi

      # Org rulesets require a PR and an `ECC-` branch prefix.
      - name: Commit version bump
        if: steps.bump.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUMP_BRANCH="ECC-publish-bump-${TAG_PREFIX}${VERSION}"
          gh pr list --state open --head "${BUMP_BRANCH}" --json number --jq '.[0].number' \
            | xargs -r -I{} gh pr close {} --delete-branch
          git push origin --delete "${BUMP_BRANCH}" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BUMP_BRANCH}"
          git add -u
          git commit -m "chore: bump ${PACKAGE} to ${VERSION}"
          git push origin "${BUMP_BRANCH}"
          echo "BUMP_BRANCH=${BUMP_BRANCH}" >> "${GITHUB_ENV}"

      - name: Open and merge version bump PR
        if: steps.bump.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL="$(gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${BUMP_BRANCH}" \
            --title "chore: bump ${PACKAGE} to ${VERSION}" \
            --body "Automated version bump after publishing release ${RELEASE_TAG}.")"
          gh pr merge "${PR_URL}" --squash --delete-branch \
            --subject "chore: bump ${PACKAGE} to ${VERSION} [skip ci]"
