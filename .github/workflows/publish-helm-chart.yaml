# Package a Helm chart and push it to an OCI registry on Google Artifact Registry.
#
# The chart version is derived from the triggering `<tag-prefix>X.Y.Z` git tag (push or release), or from the chart
# `appVersion` (`<tag-prefix>X.Y.Z`) when not triggered by a tag. After the push, `version` and `appVersion` in
# Chart.yaml are bumped on the default branch through a PR, as `publish-npm.yaml` does with package.json.
# Callers need `permissions: id-token: write, contents: write, pull-requests: write` and the target repository must
# grant `roles/artifactregistry.writer` to the calling GitHub repository.
#
# Example:
#   jobs:
#     publish-chart:
#       uses: Corvina-R-D/corvina-github-public-actions/.github/workflows/publish-helm-chart.yaml@v5
#       with:
#         chart-path: helm-charts
#         oci-repository: europe-docker.pkg.dev/corvina-app-stasher/charts
#         gcp-project-id: corvina-app-stasher
on:
  workflow_call:
    inputs:
      chart-path:
        description: Path to the chart directory (the one containing Chart.yaml)
        required: true
        type: string
      oci-repository:
        description: OCI repository to push to, without the `oci://` scheme and chart name (e.g. europe-docker.pkg.dev/<project>/charts); its host is the registry logged in to
        required: true
        type: string
      # GCP
      gcp-project-id:
        required: false
        type: string
      gcp-workload-identity-provider:
        description: Workload identity provider used to authenticate to Google Cloud
        required: false
        type: string
        default: projects/5996410059/locations/global/workloadIdentityPools/external/providers/github
      tag-prefix:
        description: Prefix stripped from the git tag and from the chart appVersion to compute the chart version
        required: false
        type: string
        default: chart-
      chart-version:
        description: Explicit chart version, overrides the one derived from the git tag or appVersion
        required: false
        type: string
      app-version:
        description: Explicit chart appVersion, defaults to the one in Chart.yaml
        required: false
        type: string
      allow-overwrite:
        description: Allow pushing a chart version that already exists in the registry
        required: false
        type: boolean
        default: false
      helm-version:
        required: false
        type: string
        default: v3.17.3
      default-branch:
        description: Branch where the released version is recorded in Chart.yaml
        required: false
        type: string
        default: main
    outputs:
      version:
        description: Version of the pushed chart
        value: ${{ jobs.publish.outputs.version }}
      chart-ref:
        description: Fully qualified reference of the pushed chart (oci://<repository>/<name>:<version>)
        value: ${{ jobs.publish.outputs.chart-ref }}
      digest:
        description: Digest of the pushed chart
        value: ${{ jobs.publish.outputs.digest }}

name: Publish Helm chart

permissions:
  contents: read
  id-token: write

env:
  TAG_PREFIX: ${{ inputs.tag-prefix }}

jobs:
  publish:
    name: Package and push Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        # explicit shell enables pipefail
        shell: bash
    outputs:
      chart-ref: ${{ steps.push.outputs.chart-ref }}
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
      app-version: ${{ steps.version.outputs.app-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Login to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.gcp-project-id }}
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # no helm registry login: helm reuses the docker credential helper
      - name: Setup credential helper for Artifact Registry
        env:
          OCI_REPOSITORY: ${{ inputs.oci-repository }}
        run: gcloud auth configure-docker "${OCI_REPOSITORY%%/*}" --quiet

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ inputs.helm-version }}

      - name: Compute chart version
        id: version
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          INPUT_CHART_VERSION: ${{ inputs.chart-version }}
          INPUT_APP_VERSION: ${{ inputs.app-version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          name=$(yq '.name' "${CHART_PATH}/Chart.yaml")
          chart_app_version=$(yq '.appVersion' "${CHART_PATH}/Chart.yaml")

          # the tag wins over Chart.yaml, which is bumped on the default branch after the push
          if [ "${REF_TYPE}" = "tag" ]; then
            if [[ "${REF_NAME}" != "${TAG_PREFIX}"* ]]; then
              echo "::error::Tag ${REF_NAME} does not start with ${TAG_PREFIX}"
              exit 1
            fi
            chart_app_version=${REF_NAME}
          fi

          app_version=${INPUT_APP_VERSION:-$chart_app_version}
          version=${INPUT_CHART_VERSION:-${app_version#"$TAG_PREFIX"}}

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Chart version '${version}' is not a valid semantic version"
            exit 1
          fi

          echo "Publishing chart ${name} version ${version} (appVersion ${app_version})"
          {
            echo "name=${name}"
            echo "version=${version}"
            echo "app-version=${app_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Check chart version is not already published
        if: ${{ !inputs.allow-overwrite }}
        env:
          OCI_REPOSITORY: ${{ inputs.oci-repository }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if helm show chart "oci://${OCI_REPOSITORY}/${NAME}" --version "${VERSION}" > /dev/null 2>&1; then
            echo "::error::Chart ${NAME} ${VERSION} already exists in ${OCI_REPOSITORY}"
            exit 1
          fi

      - name: Package chart
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION: ${{ steps.version.outputs.app-version }}
        run: |
          helm dependency build "${CHART_PATH}"
          helm lint "${CHART_PATH}"
          helm package "${CHART_PATH}" --version "${VERSION}" --app-version "${APP_VERSION}" --destination dist

      - name: Push chart
        id: push
        env:
          OCI_REPOSITORY: ${{ inputs.oci-repository }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm push "dist/${NAME}-${VERSION}.tgz" "oci://${OCI_REPOSITORY}" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: //p' push.log)
          chart_ref="oci://${OCI_REPOSITORY}/${NAME}:${VERSION}"
          {
            echo "chart-ref=${chart_ref}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Published \`${NAME}\` ${VERSION}"
            echo
            echo "- Reference: \`${chart_ref}\`"
            echo "- Digest: \`${digest}\`"
            echo
            echo '```yaml'
            echo "dependencies:"
            echo "  - name: ${NAME}"
            echo "    version: \"${VERSION}\""
            echo "    repository: oci://${OCI_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate job: a failure here doesn't affect the pushed chart and can be re-run alone.
  sync-version:
    name: Record the released version
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    env:
      DEFAULT_BRANCH: ${{ inputs.default-branch }}
      CHART_FILE: ${{ inputs.chart-path }}/Chart.yaml
      VERSION: ${{ needs.publish.outputs.version }}
      APP_VERSION: ${{ needs.publish.outputs.app-version }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.default-branch }}

      # Only moves forward: skips prereleases and versions not newer than the one in Chart.yaml.
      - name: Decide whether the version needs the bump
        id: bump
        run: |
          CURRENT="$(yq '.version' "${CHART_FILE}")"
          NAME="$(yq '.name' "${CHART_FILE}")"
          echo "NAME=${NAME}" >> "${GITHUB_ENV}"
          core() { local v="${1%%[-+]*}"; echo "${v//./ }"; }
          newer() {
            local -a r c
            read -ra r <<< "$(core "$1")"
            read -ra c <<< "$(core "$2")"
            for i in 0 1 2; do
              [ "${r[i]}" -ne "${c[i]}" ] && { [ "${r[i]}" -gt "${c[i]}" ]; return; }
            done
            [[ "$2" == *-* ]]
          }
          if [[ "${VERSION}" == *-* ]]; then
            echo "::notice::${VERSION} is a prerelease, leaving ${DEFAULT_BRANCH} at ${CURRENT}"
          elif newer "${VERSION}" "${CURRENT}"; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::${DEFAULT_BRANCH} is already at ${CURRENT}, not moving it to ${VERSION}"
          fi

      # sed rather than yq, to keep the comments and formatting of Chart.yaml
      - name: Set version
        if: steps.bump.outputs.needed == 'true'
        run: |
          sed -i -E \
            -e "s#^version:.*#version: ${VERSION}#" \
            -e "s#^appVersion:.*#appVersion: \"${APP_VERSION}\"#" \
            "${CHART_FILE}"
          if [ "$(yq '.version' "${CHART_FILE}")" != "${VERSION}" ] || [ "$(yq '.appVersion' "${CHART_FILE}")" != "${APP_VERSION}" ]; then
            echo "::error::Could not set version ${VERSION} and appVersion ${APP_VERSION} in ${CHART_FILE}"
            exit 1
          fi

      # Org rulesets require a PR and an `ECC-` branch prefix.
      - name: Commit version bump
        if: steps.bump.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUMP_BRANCH="ECC-publish-bump-${TAG_PREFIX}${VERSION}"
          gh pr list --state open --head "${BUMP_BRANCH}" --json number --jq '.[0].number' \
            | xargs -r -I{} gh pr close {} --delete-branch
          git push origin --delete "${BUMP_BRANCH}" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BUMP_BRANCH}"
          git add "${CHART_FILE}"
          git commit -m "chore: bump ${NAME} chart to ${VERSION}"
          git push origin "${BUMP_BRANCH}"
          echo "BUMP_BRANCH=${BUMP_BRANCH}" >> "${GITHUB_ENV}"

      # Doesn't fail where Actions can't open PRs or approvals are required: the bump is left
      # for a maintainer to open or merge.
      - name: Open and merge version bump PR
        if: steps.bump.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! PR_URL="$(gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${BUMP_BRANCH}" \
            --title "chore: bump ${NAME} chart to ${VERSION}" \
            --body "Automated version bump after publishing chart ${NAME} ${VERSION}.")"; then
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${BUMP_BRANCH}?expand=1"
            echo "::warning::Could not open the version bump PR, open it from ${COMPARE_URL}"
            echo "Version bump to open and merge: [${BUMP_BRANCH}](${COMPARE_URL})" >> "${GITHUB_STEP_SUMMARY}"
          elif ! gh pr merge "${PR_URL}" --squash --delete-branch \
            --subject "chore: bump ${NAME} chart to ${VERSION} [skip ci]"; then
            echo "::warning::Could not merge the version bump PR, it needs approval: ${PR_URL}"
            echo "Version bump PR to approve and merge: ${PR_URL}" >> "${GITHUB_STEP_SUMMARY}"
          fi
